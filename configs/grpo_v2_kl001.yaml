# GRPO-V2 round: KL regularization single-variable check (H1).
#
# Identical to configs/grpo_v1_full.yaml except `training.beta`: 0.0 -> 0.01.
# trainer: scripts/train_grpo_trl.py (TRL 0.23 GRPOTrainer, single GPU).
#
# Because beta > 0, the trainer loads an *explicit* frozen reference model from
# `reference_checkpoint` (SFT Epoch4) instead of letting TRL fall back to
# disable_adapter() (which would be the Qwen base model).
dataset_version: kk-v2-statement-first
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
init_checkpoint: outputs/sft_v2_5k_p800/checkpoint-1252
reference_checkpoint: outputs/sft_v2_5k_p800/checkpoint-1252

seed: 20260830

train_file: data/processed/grpo_v1_train.jsonl
val_file: data/processed/v2_answer_only_val.jsonl
output_dir: outputs/grpo_v2_kl001

generation:
  num_generations: 8
  temperature: 0.8
  top_p: 0.95
  max_completion_length: 64
  max_prompt_length: 512

training:
  bf16: true
  gradient_checkpointing: false

  # The single algorithmic variable vs GRPO-V1.
  beta: 0.01

  clip_range: 0.2
  # Unique prompts per optimizer step. In TRL 0.23 the trainer batch is
  # prompt_batch_size * num_generations rows (each unique prompt repeated
  # num_generations times), so per_device_train_batch_size is set to that product.
  prompt_batch_size: 8
  learning_rate: 1e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  epochs: 1
  max_steps: -1
  eval_every: 100
  save_every: 100
  log_every: 1

reward:
  correct: 1.0
  incorrect: 0.0
  parse_failure: 0.0
  format_invalid: 0.0
