model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
output_dir: outputs/sft_v2_1k_p800

seed: 42
max_length: 512
num_train_epochs: 5
max_steps: -1
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
gradient_accumulation_steps: 1

learning_rate: 0.0001
weight_decay: 0.0
warmup_ratio: 0.05
logging_steps: 20
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 10
save_steps: 50
eval_steps: 50

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

bf16: true
fp16: false
pad_to_multiple_of: 8
gradient_checkpointing: false
packing: false
completion_only_loss: true
report_to: "none"
