[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-reasoning-sft"
version = "0.1.0"
description = "A transparent Knights & Knaves SFT-to-RL learning project."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.45",
  "datasets>=2.18",
  "peft>=0.12",
  "trl>=0.15",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

